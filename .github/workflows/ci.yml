name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, musl-gcc]
    name: build (${{ matrix.cc }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools valgrind

      - name: Build
        run: make CC=${{ matrix.cc }}

      # The attach test (--follow) seizes a sibling process; that needs classic
      # (non-descendant) ptrace, which Ubuntu runners disable by default
      # (Yama ptrace_scope=1). Relax it so the test runs instead of being skipped.
      - name: Allow non-descendant ptrace
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Test
        run: make test CC=${{ matrix.cc }}

      # valgrind is run against the glibc build only; it does not reliably
      # instrument musl-linked binaries. error-exitcode 99 keeps valgrind's
      # own failures distinct from verba's 0/1/2 contract.
      - name: Valgrind
        if: matrix.cc == 'gcc'
        run: |
          VG="valgrind --error-exitcode=99 --leak-check=full"
          $VG ./verba --version
          $VG ./verba --help
          $VG ./verba --nope || test $? -eq 2
          mkdir -p .vg
          $VG ./verba ./fixtures/honest.sh ./.vg/honest.out
          $VG ./verba ./fixtures/liar-installer.sh ./.vg/undeclared.out || test $? -eq 1
          $VG ./verba ./fixtures/tty-liar.sh ./.vg/tty.out || test $? -eq 1
          $VG ./verba --tty ./fixtures/tty-liar.sh ./.vg/tty2.out || test $? -eq 1

  coverage:
    runs-on: ubuntu-latest
    name: coverage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lcov

      # Coverage includes the attach test, which seizes a sibling process; relax
      # Yama's ptrace_scope so that path is measured rather than skipped.
      - name: Allow non-descendant ptrace
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Generate coverage
        run: make coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
